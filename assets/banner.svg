<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">After Effect MCP banner</title>
  <desc id="desc">A futuristic banner showing ChatGPT connected through MCP to Adobe After Effects automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080B12"/>
      <stop offset="0.42" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#170B24"/>
    </linearGradient>
    <linearGradient id="cyan" x1="142" y1="53" x2="1391" y2="503" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26E4FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="magenta" x1="1140" y1="70" x2="1510" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4FA3"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.85 0 0 0 0 1 0 0 0 0.65 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" stroke="#9FB7D9" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <path d="M-80 145 C260 30 420 150 700 88 C1020 17 1240 57 1690 -30 L1690 145 C1290 232 1000 154 720 227 C425 303 205 202 -80 315 Z" fill="#18D8FF" opacity="0.14" filter="url(#soft)"/>
  <path d="M900 520 C1040 320 1190 338 1350 230 C1465 152 1548 52 1668 -68 L1668 548 Z" fill="url(#magenta)" opacity="0.24" filter="url(#soft)"/>

  <g opacity="0.34">
    <circle cx="151" cy="91" r="4" fill="#26E4FF"/>
    <circle cx="284" cy="402" r="3" fill="#F9E6A2"/>
    <circle cx="459" cy="82" r="5" fill="#7CFFCB"/>
    <circle cx="1262" cy="101" r="4" fill="#FF4FA3"/>
    <circle cx="1425" cy="387" r="5" fill="#26E4FF"/>
    <circle cx="1056" cy="428" r="3" fill="#F9E6A2"/>
    <circle cx="736" cy="415" r="4" fill="#7C5CFF"/>
  </g>

  <g filter="url(#glow)">
    <path d="M452 251 H675" stroke="#26E4FF" stroke-width="5" stroke-linecap="round"/>
    <path d="M925 251 H1160" stroke="#C15CFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M665 251 L640 237 M665 251 L640 265" stroke="#26E4FF" stroke-width="5" stroke-linecap="round"/>
    <path d="M1150 251 L1125 237 M1150 251 L1125 265" stroke="#C15CFF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="210" y="178" width="250" height="146" rx="18" fill="#0F1B24" stroke="#31F0C3" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="218" y="186" width="234" height="130" rx="14" fill="#31F0C3" opacity="0.08"/>
    <circle cx="265" cy="251" r="31" fill="#31F0C3" opacity="0.14"/>
    <path d="M253 250 C253 235 266 224 282 229 C295 233 302 248 297 261 C292 275 277 282 263 275 C257 272 252 267 249 261" stroke="#9BFFE5" stroke-width="6" stroke-linecap="round"/>
    <text x="335" y="247" text-anchor="middle" fill="#EAFBF8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="700">ChatGPT</text>
    <text x="335" y="282" text-anchor="middle" fill="#9ADFD4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">creative prompt</text>
  </g>

  <g>
    <rect x="675" y="158" width="250" height="186" rx="22" fill="#0D1730" stroke="#3BCBFF" stroke-opacity="0.65" stroke-width="2"/>
    <rect x="690" y="173" width="220" height="156" rx="16" fill="url(#cyan)" opacity="0.12"/>
    <path d="M755 255 C775 215 826 215 846 255 C826 295 775 295 755 255Z" stroke="#DDF8FF" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="800" cy="255" r="18" fill="#26E4FF"/>
    <text x="800" y="203" text-anchor="middle" fill="#ECFBFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">MCP</text>
    <text x="800" y="306" text-anchor="middle" fill="#A8DFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">tool bridge</text>
  </g>

  <g>
    <rect x="1160" y="178" width="280" height="146" rx="18" fill="#170F2C" stroke="#C15CFF" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="1168" y="186" width="264" height="130" rx="14" fill="#C15CFF" opacity="0.09"/>
    <rect x="1218" y="222" width="62" height="58" rx="10" fill="#CE8BFF" opacity="0.16" stroke="#E7C6FF" stroke-width="3"/>
    <path d="M1295 282 L1340 218 H1360 L1315 282Z" fill="#FFB3E0"/>
    <text x="1300" y="247" text-anchor="middle" fill="#FAF4FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="800">After Effects</text>
    <text x="1300" y="282" text-anchor="middle" fill="#D8B8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">layers + keyframes</text>
  </g>

  <g>
    <text x="800" y="76" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="850" letter-spacing="0">After Effect MCP</text>
    <text x="800" y="119" text-anchor="middle" fill="#B9C7DA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="500">Control Adobe After Effects from MCP clients with ExtendScript automation</text>
  </g>

  <g>
    <rect x="392" y="382" width="816" height="52" rx="14" fill="#070A10" stroke="#7EA7FF" stroke-opacity="0.22"/>
    <text x="430" y="416" fill="#76FFCD" font-family="Cascadia Code, Consolas, monospace" font-size="22">&gt; ae_eval: create comps, text layers, solids, renders...</text>
    <rect x="1138" y="394" width="14" height="28" fill="#76FFCD">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
